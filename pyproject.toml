[project]
name = "jellydrift"
version = "0.1.0"
description = "Lagrangian hindcasts of jellyfish (Pelagia noctiluca) stranding on the Alboran Sea coast"
authors = [
    { name = "Carlos Herrera Pérez" }
]
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.26.0",
    "copernicusmarine>=2.5.0",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.4",
    "numba>=0.67.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "xarray>=2026.7.0",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
jellydrift = "jellydrift.cli:main"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
